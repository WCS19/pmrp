name: ci

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pmrp_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pmrp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Synchronize environment
        run: uv sync --locked --all-groups

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Test unit and property suites
        run: uv run pytest -m "unit or property"

      - name: Test database migrations
        env:
          PMRP_DATABASE_REQUIRE_TLS: "false"
          PMRP_DATABASE_URL: postgresql+asyncpg://postgres@127.0.0.1:5432/pmrp_test
        run: uv run pytest -m database

      - name: Test with branch coverage
        run: >
          uv run pytest
          --cov=src/pmrp
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml

      - name: Build package
        run: uv build
